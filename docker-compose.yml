services:

  backend1:
    build: ./backend
    container_name: url-backend-1
    environment:
      PORT: 5000
      MONGO_URI: mongodb://url-mongodb:27017/urlshortener
      REDIS_URL: redis://url-redis:6379
    expose:
      - "5000"
    depends_on:
      - url-mongodb
      - url-redis

  backend2:
    build: ./backend
    container_name: url-backend-2
    environment:
      PORT: 5001
      MONGO_URI: mongodb://url-mongodb:27017/urlshortener
      REDIS_URL: redis://url-redis:6379
    expose:
      - "5001"
    depends_on:
      - url-mongodb
      - url-redis

  backend3:
    build: ./backend
    container_name: url-backend-3
    environment:
      PORT: 5002
      MONGO_URI: mongodb://url-mongodb:27017/urlshortener
      REDIS_URL: redis://url-redis:6379
    expose:
      - "5002"
    depends_on:
      - url-mongodb
      - url-redis

  nginx:
    image: nginx:latest
    container_name: url-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3

  url-mongodb:
    image: mongo:latest
    container_name: url-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  url-redis:
    image: redis:7
    container_name: url-redis
    ports:
      - "7000:6379"

volumes:
  mongodb_data: